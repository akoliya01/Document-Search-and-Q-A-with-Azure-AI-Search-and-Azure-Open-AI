<!DOCTYPE html>
<html>
<head>
    <title>Document Search POC</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Document Search & Q&A</h1>
    <form method="POST">
        <input type="text" name="query" placeholder="Ask a question..." required>
        <input type="submit" value="Search">
    </form>
    {% if query %}
        <h3>Query: {{ query }}</h3>
        <p>{{ answer }}</p>
    {% endif %}
</body>
</html>
